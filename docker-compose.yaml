services:
  research:
    image: ${PROJECT_NAME:-docker-research}:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME:-docker-research}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    working_dir: /workspace
    volumes:
      - .:/workspace
      - type: bind
        source: ${DATASETS_DIR:-./datasets}
        target: /workspace/datasets
        bind:
          create_host_path: false
      - home:/home/${PROJECT_NAME:-docker-research}
    gpus: all
    stdin_open: true
    tty: true
    command: sleep infinity
volumes:
  home:
    name: ${PROJECT_NAME:-docker-research}
